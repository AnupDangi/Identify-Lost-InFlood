<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DVI Candidate Review (local prototype)</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e2430; --border: #2a3140;
    --text: #e7ebf0; --muted: #8a94a6; --accent: #4f8cff;
    --good: #2fb170; --bad: #d1495b; --warn: #d1a94f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 16px; background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .badge { font-size: 11px; color: var(--warn); border: 1px solid var(--warn);
    border-radius: 4px; padding: 2px 8px; }
  header .source { font-size: 12px; color: var(--muted); margin-left: auto; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 53px); }
  #list { overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); }
  .row-item { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex;
    gap: 10px; align-items: center; }
  .row-item.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .row-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; background: #333; }
  .row-item img.blurred { filter: blur(8px); }
  .row-item .meta { min-width: 0; flex: 1; }
  .row-item .id { font-weight: 600; font-size: 12px; }
  .row-item .sub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .row-item .btncol { display: flex; flex-direction: column; align-items: stretch; gap: 3px; flex: none; }
  .search-btn { background: var(--accent); color: #fff; border: none; border-radius: 5px;
    padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .search-btn:hover { opacity: .85; }
  .no-face-note { font-size: 9px; color: var(--muted); text-align: center; }
  #detail { overflow-y: auto; padding: 20px; }
  .rec-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
  .photo-box { position: relative; width: 160px; height: 160px; flex: none; }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; background: #333; }
  .photo-box img.hidden-photo { filter: blur(18px) brightness(0.6); }
  .reveal-btn { position: absolute; inset: 0; margin: auto; width: fit-content; height: fit-content;
    background: rgba(0,0,0,.6); color: #fff; border: 1px solid #fff5; border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font-size: 12px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .rec-fields dt { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .rec-fields dd { margin: 0; font-size: 13px; }
  .rec-fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 20px; }
  .candidates { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .cand-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .cand-card .photo-box { width: 100%; height: 150px; margin-bottom: 8px; }
  .cand-card .rank { font-size: 11px; color: var(--muted); }
  .cand-card .name { font-weight: 600; font-size: 13px; margin: 2px 0 6px; }
  .scorebar { display: flex; gap: 6px; margin: 6px 0; font-size: 11px; flex-wrap: wrap; }
  .scorebar span { background: var(--panel2); border-radius: 4px; padding: 2px 6px; }
  .scorebar .final { background: var(--accent); color: #fff; font-weight: 600; }
  .scorebar .conflict { background: var(--bad); color: #fff; }
  .score-note { font-size: 10px; color: var(--muted); margin: 2px 0 6px; }
  .fallback-note { font-size: 12px; color: var(--warn); border: 1px dashed var(--warn); border-radius: 6px;
    padding: 8px 12px; margin-bottom: 16px; }
  .cand-fields { font-size: 12px; color: var(--muted); margin: 6px 0; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions button { flex: 1; border: 1px solid var(--border); background: var(--panel2);
    color: var(--text); border-radius: 6px; padding: 6px 4px; font-size: 11px; cursor: pointer; }
  .actions button.potential:hover, .actions button.potential.selected { background: var(--good); border-color: var(--good); }
  .actions button.rejected:hover, .actions button.rejected.selected { background: var(--bad); border-color: var(--bad); }
  .actions button.inconclusive:hover, .actions button.inconclusive.selected { background: var(--warn); border-color: var(--warn); color: #111; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .disclaimer { font-size: 12px; color: var(--warn); border: 1px dashed var(--warn); border-radius: 6px;
    padding: 8px 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>DVI Candidate Review</h1>
  <div class="tabs">
    <button id="tabPm" class="active">Dead Bodies</button>
    <button id="tabAm">Missing</button>
  </div>
  <span class="badge">LOCAL PROTOTYPE - NOT AN IDENTIFICATION TOOL</span>
  <span class="source" id="sourceLabel"></span>
</header>
<main>
  <div id="list"><div class="empty">Loading...</div></div>
  <div id="detail"><div class="empty">Select a record and click Find Candidates.</div></div>
</main>
<script>
const API = "";
// PM = unidentified bodies (sensitive, blurred by default). AM = missing persons (not blurred).
let state = { tab: "pm", items: [], selectedId: null };

document.getElementById("tabPm").onclick = () => switchTab("pm");
document.getElementById("tabAm").onclick = () => switchTab("am");

function switchTab(tab) {
  state.tab = tab;
  document.getElementById("tabPm").classList.toggle("active", tab === "pm");
  document.getElementById("tabAm").classList.toggle("active", tab === "am");
  document.getElementById("detail").innerHTML = `<div class="empty">Select a record and click Find Candidates.</div>`;
  loadList();
}

function fmtAge(r) {
  if (r.age_min && r.age_max && r.age_min !== r.age_max) return `${r.age_min}-${r.age_max}y`;
  if (r.age_min) return `${r.age_min}y`;
  return "age ?";
}

async function loadList() {
  const endpoint = state.tab === "pm" ? "/api/pm" : "/api/am";
  const res = await fetch(`${API}${endpoint}?limit=1000`);
  if (!res.ok) {
    document.getElementById("list").innerHTML =
      `<div class="empty">No data found for this tab yet.</div>`;
    return;
  }
  const data = await res.json();
  state.items = data.items;
  document.getElementById("sourceLabel").textContent = `${data.total} record(s)`;

  const list = document.getElementById("list");
  list.innerHTML = "";
  data.items.forEach(rec => {
    const el = document.createElement("div");
    el.className = "row-item";
    el.dataset.id = rec.record_id;
    const blurClass = state.tab === "pm" ? "blurred" : "";
    el.innerHTML = `
      <img class="${blurClass}" src="${rec.image_url || ''}" loading="lazy" />
      <div class="meta">
        <div class="id">${rec.record_id}${rec.name ? " - " + rec.name : ""}</div>
        <div class="sub">${rec.sex || "?"} - ${fmtAge(rec)} - ${rec.location || "no location"}</div>
      </div>
      <div class="btncol">
        <button class="search-btn">Find Candidates</button>
        ${!rec.has_face ? `<span class="no-face-note">no face - metadata only</span>` : ""}
      </div>
    `;
    el.querySelector(".search-btn").onclick = () => selectRecord(rec, el);
    list.appendChild(el);
  });
}

async function selectRecord(rec, el) {
  document.querySelectorAll(".row-item").forEach(n => n.classList.remove("active"));
  el.classList.add("active");
  state.selectedId = rec.record_id;

  const endpoint = state.tab === "pm"
    ? `/api/pm/${encodeURIComponent(rec.record_id)}/candidates`
    : `/api/am/${encodeURIComponent(rec.record_id)}/candidates`;
  const res = await fetch(`${API}${endpoint}?top_k=20`);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: "request failed" }));
    document.getElementById("detail").innerHTML = `<div class="empty">${err.detail}</div>`;
    return;
  }
  const data = await res.json();
  renderDetail(rec, data);
}

function photoBox(url, isPm, idSuffix) {
  const blurred = isPm ? "hidden-photo" : "";
  const revealBtn = isPm ? `<button class="reveal-btn" data-reveal="${idSuffix}">Reveal image</button>` : "";
  return `<div class="photo-box">
    <img class="${blurred}" id="photo-${idSuffix}" src="${url || ''}" />
    ${revealBtn}
  </div>`;
}

function wireReveal(root) {
  root.querySelectorAll("[data-reveal]").forEach(btn => {
    btn.onclick = (e) => {
      const id = btn.dataset.reveal;
      document.getElementById(`photo-${id}`).classList.remove("hidden-photo");
      e.target.remove();
    };
  });
}

function renderDetail(rec, candRes) {
  const isPmQuery = state.tab === "pm";
  const otherLabel = isPmQuery ? "missing persons" : "unidentified bodies";
  const detail = document.getElementById("detail");

  const fallbackNote = candRes.source === "metadata_only"
    ? `<div class="fallback-note">Face evidence unavailable for this record. Candidates below are
        based on metadata only (sex, age, height, date, location) -- not face similarity.</div>`
    : "";

  detail.innerHTML = `
    <div class="disclaimer">${candRes.disclaimer || "Ranking score is not an identity probability. This is a shortlist for human review only -- confirm with fingerprint, dental, or DNA evidence."}</div>
    ${fallbackNote}
    <div class="rec-header">
      ${photoBox(rec.image_url, isPmQuery, "main")}
      <dl class="rec-fields">
        <div><dt>Record</dt><dd>${rec.record_id}</dd></div>
        <div><dt>Name</dt><dd>${rec.name || "-"}</dd></div>
        <div><dt>Sex</dt><dd>${rec.sex || "-"} ${rec.detected_sex ? `(photo reads: ${rec.detected_sex})` : ""}</dd></div>
        <div><dt>Age</dt><dd>${fmtAge(rec)}</dd></div>
        <div><dt>Date</dt><dd>${rec.event_date || "-"}</dd></div>
        <div><dt>Location</dt><dd>${rec.location || "-"}</dd></div>
        <div><dt>Disaster tag</dt><dd>${rec.disaster_tag || "-"}</dd></div>
        <div><dt>Current facility</dt><dd>${rec.current_facility || "-"}</dd></div>
      </dl>
    </div>
    <h3>Top ${candRes.candidates.length} candidate ${otherLabel} (source: ${candRes.source})</h3>
    <div class="candidates" id="candGrid"></div>
  `;
  wireReveal(detail);

  const grid = document.getElementById("candGrid");
  if (!candRes.candidates.length) {
    grid.innerHTML = `<div class="empty">No candidates surfaced for this record within the current shortlist.</div>`;
  }
  candRes.candidates.forEach((c, i) => {
    const candId = c.am_record_id || c.pm_record_id;
    const candIsPm = !isPmQuery; // candidates are the opposite type from the query
    const card = document.createElement("div");
    card.className = "cand-card";
    const conflictBadges = [
      c.pair_metadata_conflict ? `<span class="conflict">recorded sex differs</span>` : "",
      c.pair_vision_conflict ? `<span class="conflict">photo-estimated sex differs</span>` : "",
      c.am_metadata_vision_conflict ? `<span class="conflict">AM photo/record sex differ</span>` : "",
      c.pm_metadata_vision_conflict ? `<span class="conflict">PM photo/record sex differ</span>` : "",
    ].join("");
    card.innerHTML = `
      <div class="rank">#${c.rank}</div>
      ${photoBox(c.image_url, candIsPm, "c" + i)}
      <div class="name">${c.name || "(unnamed)"}  ${candId}</div>
      <div class="scorebar">
        ${c.face_score != null ? `<span>Face similarity: ${c.face_score.toFixed(3)}</span>` : `<span>Face similarity: n/a</span>`}
        <span>Metadata compatibility: ${c.metadata_score.toFixed(3)}</span>
        <span class="final">Ranking score: ${c.final_score.toFixed(3)}</span>
        ${conflictBadges}
      </div>
      <div class="score-note">Ranking score is not an identity probability.</div>
      <div class="cand-fields">
        ${c.sex || "?"} - ${fmtAge(c)} - ${c.location || "no location"}<br/>
        date: ${c.event_date || "-"}
      </div>
      <div class="actions">
        <button class="potential" data-d="potential">Potential</button>
        <button class="rejected" data-d="rejected">Reject</button>
        <button class="inconclusive" data-d="inconclusive">Inconclusive</button>
      </div>
    `;
    wireReveal(card);
    card.querySelectorAll(".actions button").forEach(btn => {
      btn.onclick = async () => {
        const pm_record_id = isPmQuery ? rec.record_id : candId;
        const am_record_id = isPmQuery ? candId : rec.record_id;
        await fetch(`${API}/api/review`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pm_record_id, am_record_id, decision: btn.dataset.d }),
        });
        card.querySelectorAll(".actions button").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      };
    });
    grid.appendChild(card);
  });
}

loadList();
</script>
</body>
</html>
